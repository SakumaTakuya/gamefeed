name: poc-deploy-games
# PoC 用の配信 Worker（gamefeed-games-poc）を Cloudflare にデプロイする。docs/poc.md。
# `poc` ブランチへの push のたびに走る（このファイルは poc ブランチにしか無い）。
# 本番の deploy-games と同じ Secrets / Variables を使い、加えて:
#   Variables POC_APP_ORIGIN（PoC のアプリの URL。例 https://gamefeed-poc.vercel.app。末尾スラッシュなし）
# 無ければ何もしない。入れたあとは Actions の画面でこの実行を「Re-run」すればよい。
on:
  push:
    branches: [poc]
concurrency:
  group: poc-deploy-games
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: vars
        env:
          POC_APP_ORIGIN: ${{ vars.POC_APP_ORIGIN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        run: |
          if ! [[ "$POC_APP_ORIGIN" =~ ^https://[a-z0-9.-]+$ ]]; then
            echo "::warning::Variables の POC_APP_ORIGIN が無いか、https://ホスト名 の形ではないので、デプロイしていません（docs/poc.md）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! [[ "$KV_NAMESPACE_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::Variables の KV_NAMESPACE_ID が無いか、32 桁の 16 進数ではありません"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.vars.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.vars.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.vars.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - if: steps.vars.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.vars.outputs.ready == 'true'
        name: KV の namespace ID とアプリのオリジンを wrangler.toml に入れる
        env:
          POC_APP_ORIGIN: ${{ vars.POC_APP_ORIGIN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        run: |
          sed -i "s/00000000000000000000000000000000/$KV_NAMESPACE_ID/g" apps/games/wrangler.toml
          sed -i "s|https://poc-app-origin.invalid|$POC_APP_ORIGIN|" apps/games/wrangler.toml
          grep -q "APP_ORIGIN = \"$POC_APP_ORIGIN\"" apps/games/wrangler.toml
      - if: steps.vars.outputs.ready == 'true'
        name: デプロイ
        working-directory: apps/games
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env poc
      - if: steps.vars.outputs.ready == 'true'
        name: 試遊トークンの署名鍵を入れる
        working-directory: apps/games
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAMES_SIGNING_SECRET: ${{ secrets.GAMES_SIGNING_SECRET }}
        run: |
          if [ -z "$GAMES_SIGNING_SECRET" ]; then
            echo "::warning::Secrets に GAMES_SIGNING_SECRET がありません。下書きの試遊は 404 のままです"
            exit 0
          fi
          printf '%s' "$GAMES_SIGNING_SECRET" | pnpm exec wrangler secret put GAMES_SIGNING_SECRET --env poc
