<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>レーンチェンジ</title>
<meta name="gf:duration" content="480">
<meta name="gf:verb" content="きりかえろ！">
<meta name="gf:input" content="swipe">
<meta name="gf:target" content="8">
<style>
  html, body { margin: 0; height: 100%; background: #141433; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 3 本のレーンを左右のスワイプで移り、落ちてくる岩をかわす。かわした数が点数。当たると終わり
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');

const PY = 1.45, LX = [0.2, 0.5, 0.8];
let lane, rocks, moves, count, dead;   // rocks: { lane, y }

GF.onInit(() => { lane = 1; rocks = []; moves = []; count = 0; dead = false; GF.score = 0; });

GF.onInput((ev) => {
  if (ev.kind !== 'swipe') return;
  const dx = ev.data[2] - ev.data[0];
  if (Math.abs(dx) > 0.08) moves.push(dx > 0 ? 1 : -1);
});

GF.onTick((frame) => {
  const got = moves; moves = [];
  if (dead) { GF.end(); return; }
  if (got.length > 0) lane = Math.max(0, Math.min(2, lane + got[0]));   // 1 フレームに 1 レーンだけ
  if (frame % 40 === 10) {
    // 2 個に 1 個は今いるレーンに落とす。動かなければ必ず当たる
    rocks.push({ lane: count % 2 === 0 ? lane : Math.floor(GF.rng() * 3), y: -0.1 });
    count += 1;
  }
  const speed = 0.026 + frame * 0.00002;
  const rest = [];
  for (const r of rocks) {
    r.y += speed;
    if (r.lane === lane && Math.abs(r.y - PY) < 0.11) dead = true;
    if (r.y > PY + 0.11 && !r.passed) { r.passed = true; if (!dead) GF.score += 1; }
    if (r.y < A + 0.1) rest.push(r);
  }
  rocks = rest;
});

// ---- 絵: 画風カード「ドット絵」（gf://style/dot）。90 × 160 の小さな画面に 8 色で描き、補間なしで引き伸ばす ----
const hh = (n) => { const x = Math.sin(n * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); };   // 絵のための乱数。引数だけで決まる。GF.rng() は絵に使わない
const U = 90, LOW_W = 90, LOW_H = 160;   // 幅 1 の単位は、小さな画面では 90 ドット
const low = document.createElement('canvas'); low.width = LOW_W; low.height = LOW_H;
const lg = low.getContext('2d');
function px(x, y, pw, ph, color) { lg.fillStyle = color; lg.fillRect(Math.round(x), Math.round(y), pw, ph); }   // 四角を 1 つ。位置は丸める
function sprite(rows, x, y, map) {   // rows は文字の行、map は文字から色。'.' は透明
  for (let j = 0; j < rows.length; j++) {
    for (let i = 0; i < rows[j].length; i++) { const ch = rows[j][i]; if (ch !== '.') px(x + i, y + j, 1, 1, map[ch]); }
  }
}
function night() {                // 地と、瞬く星
  px(0, 0, LOW_W, LOW_H, '#141433');
  for (let i = 0; i < 34; i++) if (hh(i + Math.floor(GF.frame / 22) * 0.61) > 0.25) px(hh(i * 3.3) * LOW_W, hh(i * 9.1) * LOW_H, 1, 1, i % 5 ? '#5762d5' : '#f2f0e6');
}
function sparks8(x, y, age, c1, c2) {   // 8 方向の粒。位置は age から計算する（状態を持たない）
  if (age < 0 || age > 12) return;
  for (let i = 0; i < 8; i++) { const s = age < 7 ? 2 : 1; px(x + Math.cos(i * Math.PI / 4) * age * 1.6, y + Math.sin(i * Math.PI / 4) * age * 1.6, s, s, i % 2 ? c1 : c2); }
}
function blit() {                 // 小さな画面を表示の canvas へ。毎フレームいちばん最後に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight;
  g.fillStyle = '#141433'; g.fillRect(0, 0, w, h);
  g.imageSmoothingEnabled = false; g.drawImage(low, 0, 0, w, w * LOW_H / LOW_W);   // 縦は幅に合わせる（縦長の端末で伸ばさない）
  return w;
}
function dotText(w, text) {       // 点数。右下に 1 ドットぶんずらした影
  g.textAlign = 'left'; g.font = 'bold ' + Math.round(0.11 * w) + 'px monospace';
  g.fillStyle = '#2a2f6e'; g.fillText(String(text), (0.06 + 1 / U) * w, (0.17 + 1 / U) * w);
  g.fillStyle = '#f2f0e6'; g.fillText(String(text), 0.06 * w, 0.17 * w);
}

const ROCK = [
  '...BBBBBB...',
  '..BPPPPPPB..',
  '.BPPWWPPPPB.',
  'BPPWPPPPPPPB',
  'BPPPPPPPPPPB',
  'BPPPPPPPPBPB',
  'BPPPPPPPPPPB',
  'BPPPPPBPPPPB',
  '.BPPPPPPPPB.',
  '..BPPPPPPB..',
  '...BBBBBB...',
];
const CAR = [
  '..YYYYYYY..',
  '.YYWWWWWYY.',
  '.YWWWWWWWY.',
  'KYYYYYYYYYK',
  'KYYYYYYYYYK',
  '.YYYYYYYYY.',
  '.YWWWWWWWY.',
  'KYYYYYYYYYK',
  'KYYYYYYYYYK',
  '.RRYYYYYRR.',
];

GF.onDraw(() => {
  const f = GF.frame, roll = Math.floor(f * 2.4) % 10;                       // 道の線は岩と同じくらいの速さで流れる
  px(0, 0, LOW_W, LOW_H, '#141433');
  for (let yy = roll - 10; yy < LOW_H; yy += 10) { px(31, yy, 1, 5, '#5762d5'); px(58, yy, 1, 5, '#5762d5'); }
  px(2, 0, 1, LOW_H, '#2a2f6e'); px(87, 0, 1, LOW_H, '#2a2f6e');
  for (let i = 0; i < 8; i++) { const yy = (hh(i * 7.7) * LOW_H + f * 2.4) % LOW_H; px(i % 2 ? 0 : 89, yy, 1, 3, '#2e9e68'); }
  for (const r of rocks) sprite(ROCK, Math.round(LX[r.lane] * U) - 6, Math.round(r.y * U) - 5, { B: '#2a2f6e', P: '#5762d5', W: '#f2f0e6' });
  const cx = Math.round(LX[lane] * U), cy = Math.round(PY * U);
  sprite(CAR, cx - 5, cy - 5, { Y: dead ? '#ef476f' : '#ffd23f', W: '#f2f0e6', K: '#2a2f6e', R: '#ef476f' });
  if (dead) sparks8(cx, cy, 4, '#ef476f', '#f2f0e6');
  else if (f % 6 < 3) { px(cx - 4, cy + 5, 2, 1, '#5762d5'); px(cx + 2, cy + 5, 2, 1, '#5762d5'); }   // 排気
  dotText(blit(), GF.score);
});
</script>
</body>
</html>
