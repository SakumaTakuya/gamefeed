<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>おいかけっこ</title>
<meta name="gf:duration" content="360">
<meta name="gf:verb" content="おいかけろ！">
<meta name="gf:input" content="drag">
<meta name="gf:target" content="40">
<style>
  html, body { margin: 0; height: 100%; background: #1a1320; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 動きまわる光を指でなぞり続ける。指が光に重なっていた時間が点数（6 フレームで 1 点）
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');
function begin() {                // 描画の前に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
  g.fillStyle = '#1a1320'; g.fillRect(0, 0, w, cv.height);
  return w;
}
function hud(w, text) {
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold ' + Math.round(0.09 * w) + 'px sans-serif';
  g.fillText(String(text), 0.5 * w, 0.15 * w);
}
const R = 0.12;
let px, py, down, a, b, pa, pb, inside;   // 光は 2 つの波を重ねた道を動く

function spot(frame) {
  const t = frame / 60;
  return [0.5 + 0.34 * Math.sin(a * t + pa), 0.95 + 0.5 * Math.sin(b * t + pb)];
}

GF.onInit(() => {
  px = 0.5; py = 0.95; down = false; inside = 0; GF.score = 0;
  a = 1.0 + GF.rng() * 0.8; b = 0.8 + GF.rng() * 0.7; pa = GF.rng() * 6.28; pb = GF.rng() * 6.28;
});

GF.onInput((ev) => {
  if (ev.kind !== 'drag') return;
  px = ev.data[0]; py = ev.data[1] * A; down = ev.data[2] === 1;
});

GF.onTick((frame) => {
  const [x, y] = spot(frame);
  if (down && (x - px) * (x - px) + (y - py) * (y - py) < R * R) inside += 1;
  GF.score = Math.floor(inside / 6);
});

GF.onDraw(() => {
  const w = begin();
  const [x, y] = spot(GF.frame);
  const on = down && (x - px) * (x - px) + (y - py) * (y - py) < R * R;
  g.fillStyle = on ? '#ffd400' : '#7a5cff'; g.beginPath(); g.arc(x * w, y * w, R * w, 0, Math.PI * 2); g.fill();
  if (down) { g.strokeStyle = '#fff'; g.lineWidth = 0.008 * w; g.beginPath(); g.arc(px * w, py * w, 0.05 * w, 0, Math.PI * 2); g.stroke(); }
  hud(w, GF.score);
});
</script>
</body>
</html>
