<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ふうせんチキン</title>
<meta name="gf:duration" content="300">
<meta name="gf:verb" content="ふくらませ！">
<meta name="gf:input" content="hold">
<meta name="gf:target" content="80">
<style>
  html, body { margin: 0; height: 100%; background: #131a2b; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 押している間ふうせんがふくらむ。点線ぎりぎりで離すほど高得点（100 点まで）。点線を超えると割れて 0 点。1 回きり
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');
function begin() {                // 描画の前に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
  g.fillStyle = '#131a2b'; g.fillRect(0, 0, w, cv.height);
  return w;
}
function hud(w, text) {
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold ' + Math.round(0.09 * w) + 'px sans-serif';
  g.fillText(String(text), 0.5 * w, 0.15 * w);
}
let size, limit, holding, done, popped, endAt;

GF.onInit(() => {
  size = 0.03; limit = 0.26 + GF.rng() * 0.16; holding = false; done = false; popped = false; endAt = -1;
  GF.score = 0;
});

GF.onInput((ev) => { if (ev.kind === 'hold') holding = ev.data[2] === 1; });

GF.onTick((frame) => {
  if (done) { if (frame >= endAt) GF.end(); return; }
  if (holding) {
    size += 0.0008 + size * 0.012;       // 大きくなるほど速くふくらむ
    GF.score = Math.round((size / limit) * 100);   // 押したまま時間切れになっても、そのときの大きさが点になる
    if (size > limit) { popped = true; done = true; endAt = frame + 30; GF.score = 0; }
  } else if (size > 0.03) {
    done = true; endAt = frame + 30;
  }
});

GF.onDraw(() => {
  const w = begin();
  const cx = 0.5 * w, cy = 0.85 * w;
  g.strokeStyle = '#8fa3d9'; g.lineWidth = 0.008 * w; g.setLineDash([0.03 * w, 0.03 * w]);
  g.beginPath(); g.arc(cx, cy, limit * w, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
  if (popped) {
    g.strokeStyle = '#ff5c5c'; g.lineWidth = 0.012 * w;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      g.beginPath(); g.moveTo(cx + Math.cos(a) * limit * 0.5 * w, cy + Math.sin(a) * limit * 0.5 * w);
      g.lineTo(cx + Math.cos(a) * limit * 1.1 * w, cy + Math.sin(a) * limit * 1.1 * w); g.stroke();
    }
  } else {
    g.fillStyle = '#ff5c8a'; g.beginPath(); g.arc(cx, cy, size * w, 0, Math.PI * 2); g.fill();
  }
  hud(w, GF.score);
});
</script>
</body>
</html>
