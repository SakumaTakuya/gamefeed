<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ながおし</title>
<meta name="gf:duration" content="540">
<meta name="gf:verb" content="おさえろ！">
<meta name="gf:input" content="hold">
<meta name="gf:target" content="36">
<style>
  html, body { margin: 0; height: 100%; background: #12201c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 帯が線に重なっている間だけ押す。合っていた時間が点数（6 フレームで 1 点）。帯の無いところで押すと減る
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');
function begin() {                // 描画の前に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
  g.fillStyle = '#12201c'; g.fillRect(0, 0, w, cv.height);
  return w;
}
function hud(w, text) {
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold ' + Math.round(0.09 * w) + 'px sans-serif';
  g.fillText(String(text), 0.5 * w, 0.15 * w);
}
const LINE = 1.4, V = 0.012;      // 線の高さと、帯の落ちる速さ
let bars, holding, good, bad;     // bars: [始まりのフレーム, 終わりのフレーム]

GF.onInit(() => {
  bars = []; holding = false; good = 0; bad = 0; GF.score = 0;
  let f = 40;
  while (f < 500) {
    const len = 44 + Math.floor(GF.rng() * 31);
    bars.push([f, Math.min(520, f + len)]);
    f += len + 20 + Math.floor(GF.rng() * 17);
  }
});

function active(frame) {
  for (const [s, e] of bars) if (frame >= s && frame < e) return true;
  return false;
}

GF.onInput((ev) => { if (ev.kind === 'hold') holding = ev.data[2] === 1; });

GF.onTick((frame) => {
  if (holding) { if (active(frame)) good += 1; else bad += 1; }
  GF.score = Math.max(0, Math.floor((good - bad) / 6));
});

GF.onDraw(() => {
  const w = begin();
  const f = GF.frame, on = active(f);
  g.fillStyle = '#2f8f6f';
  for (const [s, e] of bars) {
    const y0 = LINE - (e - f) * V, y1 = LINE - (s - f) * V;
    if (y1 > 0 && y0 < A) g.fillRect(0.3 * w, y0 * w, 0.4 * w, (y1 - y0) * w);
  }
  g.fillStyle = holding ? (on ? '#ffd400' : '#ff5c5c') : '#fff';
  g.fillRect(0.1 * w, (LINE - 0.008) * w, 0.8 * w, 0.016 * w);
  hud(w, GF.score);
});
</script>
</body>
</html>
