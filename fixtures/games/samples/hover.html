<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホバー</title>
<meta name="gf:duration" content="420">
<meta name="gf:verb" content="うかせろ！">
<meta name="gf:input" content="hold">
<meta name="gf:target" content="50">
<style>
  html, body { margin: 0; height: 100%; background: #0f1a1f; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 押している間だけ上に進む玉を、動く帯の中に保つ。帯の中にいた時間が点数（6 フレームで 1 点、70 点まで）
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');
function begin() {                // 描画の前に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
  g.fillStyle = '#0f1a1f'; g.fillRect(0, 0, w, cv.height);
  return w;
}
function hud(w, text) {
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold ' + Math.round(0.09 * w) + 'px sans-serif';
  g.fillText(String(text), 0.5 * w, 0.15 * w);
}
const BAND = 0.16;                // 帯の半分の高さ
let y, vy, holding, bandY, bandGoal, inside;

GF.onInit(() => {
  y = 0.9; vy = 0; holding = false; bandY = 0.9; bandGoal = 0.9; inside = 0; GF.score = 0;
});

GF.onInput((ev) => { if (ev.kind === 'hold') holding = ev.data[2] === 1; });

GF.onTick((frame) => {
  if (frame > 20) {
    if (Math.abs(bandGoal - bandY) < 0.006) bandGoal = 0.4 + GF.rng() * 1.0;
    bandY += bandGoal > bandY ? 0.005 : -0.005;
  }
  vy += holding ? -0.0012 : 0.001;
  vy = Math.max(-0.02, Math.min(0.02, vy));
  y += vy;
  if (y < 0.05) { y = 0.05; vy = 0; }
  if (y > A - 0.05) { y = A - 0.05; vy = 0; }
  if (Math.abs(y - bandY) < BAND) inside += 1;
  GF.score = Math.floor(inside / 6);
});

GF.onDraw(() => {
  const w = begin();
  const ok = Math.abs(y - bandY) < BAND;
  g.fillStyle = ok ? '#1f4d3a' : '#27343b'; g.fillRect(0, (bandY - BAND) * w, w, BAND * 2 * w);
  g.fillStyle = ok ? '#ffd400' : '#fff'; g.beginPath(); g.arc(0.5 * w, y * w, 0.05 * w, 0, Math.PI * 2); g.fill();
  if (holding) {
    g.fillStyle = '#ff8a3c'; g.beginPath();
    g.moveTo(0.47 * w, (y + 0.05) * w); g.lineTo(0.53 * w, (y + 0.05) * w); g.lineTo(0.5 * w, (y + 0.13) * w); g.fill();
  }
  hud(w, GF.score);
});
</script>
</body>
</html>
