<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>はやうち</title>
<meta name="gf:duration" content="180">
<meta name="gf:verb" content="いまだ！">
<meta name="gf:input" content="tap">
<meta name="gf:target" content="85">
<style>
  html, body { margin: 0; height: 100%; background: #1f1010; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 「！」が出たらすぐタップ。早いほど高得点（100 点から 1 フレームごとに 1 点減る）。出る前に押すと 0 点。1 回きり
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');
function begin() {                // 描画の前に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
  g.fillStyle = '#1f1010'; g.fillRect(0, 0, w, cv.height);
  return w;
}
function hud(w, text) {
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold ' + Math.round(0.09 * w) + 'px sans-serif';
  g.fillText(String(text), 0.5 * w, 0.15 * w);
}
let signalAt, lit, taps, done, foul, endAt;

GF.onInit(() => {
  signalAt = 40 + Math.floor(GF.rng() * 80); lit = false; taps = 0; done = false; foul = false; endAt = -1;
  GF.score = 0;
});

GF.onInput((ev) => { if (ev.kind === 'tap') taps += 1; });

GF.onTick((frame) => {
  const tapped = taps > 0; taps = 0;
  if (done) { if (frame >= endAt) GF.end(); return; }
  if (tapped) {
    done = true; endAt = frame + 24;
    if (lit) GF.score = Math.max(1, 100 - (frame - signalAt)); else foul = true;
    return;
  }
  if (frame >= signalAt) lit = true;
});

GF.onDraw(() => {
  const w = begin();
  g.textAlign = 'center';
  if (foul) {
    g.fillStyle = '#ff5c5c'; g.font = 'bold ' + Math.round(0.14 * w) + 'px sans-serif';
    g.fillText('おてつき', 0.5 * w, 0.95 * w);
  } else if (lit) {
    g.fillStyle = '#ffd400'; g.beginPath(); g.arc(0.5 * w, 0.88 * w, 0.3 * w, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#1f1010'; g.font = 'bold ' + Math.round(0.4 * w) + 'px sans-serif';
    g.fillText('！', 0.5 * w, 1.02 * w);
  } else {
    g.fillStyle = '#5a3a3a'; g.font = 'bold ' + Math.round(0.12 * w) + 'px sans-serif';
    g.fillText('まて…', 0.5 * w, 0.92 * w);
  }
  if (done && !foul) hud(w, GF.score);
});
</script>
</body>
</html>
