<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ハードル</title>
<meta name="gf:duration" content="480">
<meta name="gf:verb" content="とべ！">
<meta name="gf:input" content="tap">
<meta name="gf:target" content="6">
<style>
  html, body { margin: 0; height: 100%; background: #2c6170; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 走ってくるハードルをタップで跳び越す。越えた数が点数。当たると終わり
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');

const PX = 0.25, HALF = 0.04, GROUND = 1.3, OW = 0.06, OH = 0.12;
let h, vy, taps, obs, next, dead;  // h: 地面からの高さ、obs: ハードルの中心の x の並び

GF.onInit(() => { h = 0; vy = 0; taps = 0; obs = []; next = 30; dead = false; GF.score = 0; });

GF.onInput((ev) => { if (ev.kind === 'tap') taps += 1; });

GF.onTick((frame) => {
  const tapped = taps > 0; taps = 0;
  if (dead) return;
  if (tapped && h === 0) vy = 0.034;
  if (h > 0 || vy > 0) { h += vy; vy -= 0.0022; if (h <= 0) { h = 0; vy = 0; } }
  const speed = 0.018 + frame * 0.000012;
  if (frame === next) { obs.push(1.1); next = frame + 46 + Math.floor(GF.rng() * 26); }
  const rest = [];
  for (const x of obs) {
    const nx = x - speed;
    if (Math.abs(nx - PX) < HALF + OW / 2 && h < OH) dead = true;
    if (x >= PX - HALF - OW / 2 && nx < PX - HALF - OW / 2 && !dead) GF.score += 1;
    if (nx > -0.1) rest.push(nx);
  }
  obs = rest;
  if (dead) GF.end();
});

// ---- 絵: 画風カード「切り絵」（gf://style/kirie）。色は面で塗り、線は引かない。紙ごとに影、最後に紙目 ----
const hh = (n) => { const x = Math.sin(n * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); };   // 絵のための乱数。引数だけで決まる。GF.rng() は絵に使わない
function paperShadow(w, on) {     // 紙の影。紙を描く前に on、描いたら off
  g.shadowColor = on ? 'rgba(8,22,26,.42)' : 'transparent';
  g.shadowBlur = on ? 0.022 * w : 0; g.shadowOffsetX = 0; g.shadowOffsetY = on ? 0.011 * w : 0;
}
function cutBlob(x, y, r, seed, n = 11) {   // 切り口の不揃いな丸（px）。seed は物ごとに固定
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const t = i / n * Math.PI * 2, rr = r * (0.92 + hh(seed + i * 5.3) * 0.16);
    g.lineTo(x + Math.cos(t) * rr, y + Math.sin(t) * rr);
  }
  g.closePath(); g.fill();
}
function cutStar(w, x, y, r, rot, seed) {   // 紙の星（x, y, r は幅 1 の単位）
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const t = rot + i * Math.PI / 5 - Math.PI / 2, rr = (i % 2 ? 0.48 : 1) * r * (0.94 + hh(seed + i * 3.7) * 0.12);
    g.lineTo((x + Math.cos(t) * rr) * w, (y + Math.sin(t) * rr) * w);
  }
  g.closePath(); g.fill();
}
function cutHill(w, h, base, amp, seed, color, off = 0) {   // 紙の山。off を増やすと左へ流れる
  const k = Math.floor(off), fr = off - k;
  g.fillStyle = color; g.beginPath(); g.moveTo(-0.1 * w, h * 1.1);
  for (let i = -2; i <= 36; i++) {
    const n = i + k;
    g.lineTo((i - fr) / 32 * w, base + Math.sin(n * 0.3 + seed) * amp + (hh(n * 1.3 + seed * 9) - 0.5) * 0.014 * w);
  }
  g.lineTo(1.1 * w, h * 1.1); g.closePath(); g.fill();
}
function cloud(w, x, y) {         // 紙の雲（x, y は幅 1 の単位）
  g.fillStyle = '#d9e6df';
  cutBlob(x * w, y * w, 0.055 * w, x * 50, 12); cutBlob((x + 0.07) * w, (y - 0.02) * w, 0.07 * w, x * 50 + 1, 12); cutBlob((x + 0.15) * w, y * w, 0.05 * w, x * 50 + 2, 12);
}
function confetti(w, x, y, age, seed) {   // 紙吹雪。age は出てからのフレーム数。位置は age から計算する（状態を持たない）
  if (age < 0 || age > 40) return;
  const C = ['#f08a24', '#f7d154', '#5f8f3e', '#f3e3b0'];
  for (let i = 0; i < 10; i++) {
    const vx = (hh(seed + i * 1.1) - 0.5) * 0.02, vy = -0.006 - hh(seed + i * 1.7) * 0.014;
    g.save(); g.translate((x + vx * age) * w, (y + vy * age + 0.0004 * age * age) * w);
    g.rotate(i + age * 0.2); g.scale(Math.cos(age * 0.35 + i), 1);
    g.globalAlpha = Math.min(1, (40 - age) / 10); g.fillStyle = C[i % 4];
    g.fillRect(-0.012 * w, -0.008 * w, 0.024 * w, 0.016 * w); g.restore();
  }
}
let grain = null;
function paperGrain(w, h) {       // 紙目。1 回だけ作り、毎フレームいちばん最後に重ねる
  if (!grain) {
    grain = document.createElement('canvas'); grain.width = grain.height = 128;
    const c = grain.getContext('2d'), im = c.createImageData(128, 128);
    for (let i = 0; i < 128 * 128; i++) {
      const v = hh(i * 0.37) < 0.5 ? 0 : 255;
      im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = hh(i * 0.91 + 3) * 15;
    }
    c.putImageData(im, 0, 0);
  }
  g.fillStyle = g.createPattern(grain, 'repeat'); g.fillRect(0, 0, w, h);
}
function begin(sky) {             // 描画の前に呼ぶ。空を塗り、画面の幅（px）を返す
  const w = cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
  g.fillStyle = sky; g.fillRect(0, 0, w, cv.height);
  return w;
}
function label(w, text) {         // 点数。文字も紙として、影つきで
  paperShadow(w, true); g.fillStyle = '#f3e3b0'; g.textAlign = 'center';
  g.font = '900 ' + Math.round(0.13 * w) + 'px sans-serif';
  g.fillText(String(text), 0.5 * w, 0.2 * w); paperShadow(w, false);
}

GF.onDraw(() => {
  const w = begin('#2c6170'), hgt = cv.height, f = GF.frame;
  paperShadow(w, true);
  g.fillStyle = '#f3e3b0'; cutBlob(0.78 * w, 0.42 * w, 0.1 * w, 3, 28);
  cutHill(w, hgt, 0.98 * w, 0.07 * w, 1.2, '#3f8376', f * 0.01);           // 奥の山ほどゆっくり流す
  cutHill(w, hgt, 1.12 * w, 0.05 * w, 3.1, '#2f6a60', f * 0.04);
  cutHill(w, hgt, GROUND * w, 0.004 * w, 6, '#1b3f3b', f * 0.6);
  for (const x of obs) {
    g.fillStyle = '#f3e3b0'; g.fillRect((x - OW / 2) * w, (GROUND - OH) * w, OW * w, OH * w);
    g.fillStyle = '#e9573f'; g.fillRect((x - OW / 2) * w, (GROUND - OH) * w, OW * w, 0.03 * w); g.fillRect((x - OW / 2) * w, (GROUND - OH + 0.06) * w, OW * w, 0.03 * w);
  }
  const by = GROUND - h - 0.055, step = h === 0 && !dead ? Math.sin(f * 0.7) * 0.015 : 0;   // 走っている間は足を前後に
  g.fillStyle = '#16312d';
  g.fillRect((PX - 0.022 + step) * w, (by + 0.03) * w, 0.014 * w, 0.026 * w); g.fillRect((PX + 0.008 - step) * w, (by + 0.03) * w, 0.014 * w, 0.026 * w);
  g.fillStyle = dead ? '#e9573f' : '#f08a24'; cutBlob(PX * w, by * w, 0.044 * w, 4, 12);
  paperShadow(w, false);
  g.fillStyle = '#f3e3b0'; cutBlob((PX + 0.018) * w, (by - 0.01) * w, 0.014 * w, 1, 7);
  g.fillStyle = '#16312d'; cutBlob((PX + 0.023) * w, (by - 0.01) * w, 0.007 * w, 2, 6);
  label(w, GF.score);
  paperGrain(w, hgt);
});
</script>
</body>
</html>
