<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ぴったりストップ</title>
<meta name="gf:duration" content="300">
<meta name="gf:verb" content="止めろ！">
<meta name="gf:input" content="tap">
<meta name="gf:target" content="240">
<style>
  html, body { margin: 0; height: 100%; background: #10131c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 左右に動く印を、的の真上で止める。3 回。近いほど高得点（1 回 100 点まで）
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');
function begin() {                // 描画の前に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
  g.fillStyle = '#10131c'; g.fillRect(0, 0, w, cv.height);
  return w;
}
function hud(w, text) {
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold ' + Math.round(0.09 * w) + 'px sans-serif';
  g.fillText(String(text), 0.5 * w, 0.15 * w);
}
const ROUNDS = 3;
let round, pos, dir, speed, goal, taps, last, shown, endAt;

function nextGoal() { goal = 0.15 + GF.rng() * 0.7; }

GF.onInit(() => {
  round = 0; pos = GF.rng(); dir = 1; speed = 0.022; taps = 0; last = -1; shown = 0; endAt = -1;
  nextGoal(); GF.score = 0;
});

GF.onInput((ev) => { if (ev.kind === 'tap') taps += 1; });

GF.onTick((frame) => {
  const tapped = taps > 0; taps = 0;
  if (shown > 0) shown -= 1;
  if (round >= ROUNDS) { if (frame >= endAt) GF.end(); return; }   // 最後の点を少し見せてから終える
  if (tapped) {
    last = Math.max(0, Math.round(100 - Math.abs(pos - goal) * 400));
    GF.score += last; shown = 30;
    round += 1; speed *= 1.3; nextGoal();
    if (round >= ROUNDS) endAt = frame + 24;
    return;
  }
  pos += dir * speed;
  if (pos > 1) { pos = 2 - pos; dir = -1; }
  if (pos < 0) { pos = -pos; dir = 1; }
});

GF.onDraw(() => {
  const w = begin();
  const x0 = 0.1, x1 = 0.9, y = 0.9;
  const px = (v) => (x0 + (x1 - x0) * v) * w;
  g.fillStyle = '#2a3147'; g.fillRect(x0 * w, (y - 0.03) * w, (x1 - x0) * w, 0.06 * w);
  if (round < ROUNDS) {
    g.fillStyle = '#ffd400'; g.fillRect(px(goal) - 0.02 * w, (y - 0.09) * w, 0.04 * w, 0.18 * w);
  }
  g.fillStyle = '#fff'; g.beginPath(); g.arc(px(pos), y * w, 0.04 * w, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < ROUNDS; i++) {
    g.fillStyle = i < round ? '#ffd400' : '#2a3147';
    g.beginPath(); g.arc((0.4 + i * 0.1) * w, 0.32 * w, 0.025 * w, 0, Math.PI * 2); g.fill();
  }
  hud(w, GF.score);
  if (shown > 0 && last >= 0) {
    g.fillStyle = '#ffd400'; g.font = 'bold ' + Math.round(0.12 * w) + 'px sans-serif';
    g.fillText('+' + last, 0.5 * w, 0.62 * w);
  }
});
</script>
</body>
</html>
