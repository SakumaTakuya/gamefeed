<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>あめよけ</title>
<meta name="gf:duration" content="600">
<meta name="gf:verb" content="よけろ！">
<meta name="gf:input" content="drag">
<meta name="gf:target" content="85">
<style>
  html, body { margin: 0; height: 100%; background: #070512; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 降ってくる玉を、指の左右の位置を追う自機でよける。当たると終わり。耐えた時間が点数（6 フレームで 1 点、100 点まで）
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');

const PY = 1.45, PR = 0.04, BR = 0.035, MAXV = 0.03;
let px, fx, shots, dead, count;   // fx: 指の位置、shots: { x, y, vy }

GF.onInit(() => { px = 0.5; fx = 0.5; shots = []; dead = false; count = 0; GF.score = 0; });

GF.onInput((ev) => { if (ev.kind === 'drag') fx = ev.data[0]; });

GF.onTick((frame) => {
  if (dead) return;
  px += Math.max(-MAXV, Math.min(MAXV, fx - px));
  px = Math.max(PR, Math.min(1 - PR, px));
  const every = Math.max(7, 14 - Math.floor(frame / 80));
  if (frame % every === 0) {
    count += 1;
    const r = GF.rng();
    // 3 発に 1 発は自機の真上から。じっとしていると当たる
    shots.push({ x: count % 3 === 0 ? px : 0.05 + r * 0.9, y: -0.05, vy: 0.02 + frame * 0.00002 });
  }
  for (const s of shots) {
    s.y += s.vy;
    if ((s.x - px) ** 2 + (s.y - PY) ** 2 < (PR + BR) ** 2) dead = true;
  }
  shots = shots.filter(s => s.y < A + 0.1);
  if (dead) { GF.end(); return; }
  GF.score = Math.floor((frame + 1) / 6);
});

// ---- 絵: 画風カード「ネオン」（gf://style/neon）。暗い地に光だけで描く。光は加算、動く物は尾を引く ----
const hh = (n) => { const x = Math.sin(n * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); };   // 絵のための乱数。引数だけで決まる。GF.rng() は絵に使わない
function lit(draw) { g.save(); g.globalCompositeOperation = 'lighter'; draw(); g.restore(); }   // 光は加算で重ねる
function glowLine(w, pts, color, width, closed) {   // ネオン管の線。色つきの太い線の上に白い芯（pts は px）
  g.lineCap = g.lineJoin = 'round';
  g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
  if (closed) g.closePath();
  g.shadowColor = color; g.shadowBlur = 0.06 * w; g.strokeStyle = color; g.lineWidth = width; g.stroke();
  g.shadowBlur = 0; g.strokeStyle = '#fff'; g.lineWidth = width * 0.28; g.stroke();
}
function circlePts(x, y, r, n = 24) {
  const pts = [];
  for (let i = 0; i < n; i++) pts.push([x + Math.cos(i / n * Math.PI * 2) * r, y + Math.sin(i / n * Math.PI * 2) * r]);
  return pts;
}
function orb(x, y, r, rgb, tx, ty) {   // 光の玉（px）。r が当たりの大きさ。(tx, ty) は尾の向きと長さ
  if (tx || ty) {
    const t = g.createLinearGradient(x + tx, y + ty, x, y);
    t.addColorStop(0, 'rgba(' + rgb + ',0)'); t.addColorStop(1, 'rgba(' + rgb + ',.7)');
    g.strokeStyle = t; g.lineWidth = r * 1.1; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x + tx, y + ty); g.lineTo(x, y); g.stroke();
  }
  const halo = g.createRadialGradient(x, y, 0, x, y, r * 2.4);
  halo.addColorStop(0, 'rgba(' + rgb + ',.95)'); halo.addColorStop(0.4, 'rgba(' + rgb + ',.55)'); halo.addColorStop(1, 'rgba(' + rgb + ',0)');
  g.fillStyle = halo; g.beginPath(); g.arc(x, y, r * 2.4, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r * 0.45, 0, Math.PI * 2); g.fill();
}
function ring(w, x, y, u, color) {   // 広がって消える輪。u は 0（出た瞬間）から 1（消える）
  if (u < 0 || u >= 1) return;
  g.globalAlpha = 1 - u; g.strokeStyle = color; g.lineWidth = 0.014 * w * (1 - u) + 1;
  g.beginPath(); g.arc(x, y, (0.03 + u * 0.22) * w, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1;
}
function sparks(w, x, y, age, seed, color) {   // 火花。位置は age から計算する（状態を持たない）
  if (age < 0 || age > 18) return;
  g.strokeStyle = color; g.lineWidth = 0.006 * w; g.lineCap = 'round'; g.globalAlpha = 1 - age / 18;
  for (let i = 0; i < 10; i++) {
    const t = hh(seed + i * 1.3) * Math.PI * 2, sp = (0.008 + hh(seed + i * 2.9) * 0.014) * w;
    g.beginPath(); g.moveTo(x + Math.cos(t) * sp * age, y + Math.sin(t) * sp * age);
    g.lineTo(x + Math.cos(t) * sp * (age + 2.5), y + Math.sin(t) * sp * (age + 2.5)); g.stroke();
  }
  g.globalAlpha = 1;
}
function gridFloor(w, h, hz, frame) {   // 奥へ伸びる床の格子。hz は地平線（px）
  g.strokeStyle = 'rgba(255,60,210,.5)'; g.lineWidth = Math.max(1, 0.004 * w);
  g.shadowColor = '#ff3cd2'; g.shadowBlur = 0.02 * w;
  g.beginPath();
  for (let i = -9; i <= 9; i++) { g.moveTo(w / 2 + i * 0.028 * w, hz); g.lineTo(w / 2 + i * 0.26 * w, h); }
  const ph = (frame * 0.02) % 1;
  for (let i = 0; i < 9; i++) { const u = (i + ph) / 9, y = hz + (h - hz) * u * u; g.moveTo(0, y); g.lineTo(w, y); }
  g.moveTo(0, hz); g.lineTo(w, hz); g.stroke(); g.shadowBlur = 0;
}
let scan = null;
function scanlines(w, h) {        // 走査線。1 回だけ作り、毎フレームいちばん最後に重ねる
  if (!scan) {
    scan = document.createElement('canvas'); scan.width = 2; scan.height = 3;
    const c = scan.getContext('2d'); c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(0, 2, 2, 1);
  }
  g.fillStyle = g.createPattern(scan, 'repeat'); g.fillRect(0, 0, w, h);
}
function begin() {                // 描画の前に呼ぶ。暗い地と星を描き、画面の幅（px）を返す
  const w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight;
  const bg = g.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#070512'); bg.addColorStop(1, '#22093c');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    g.fillStyle = 'rgba(190,220,255,' + (0.25 + 0.5 * hh(i + Math.floor(GF.frame / 14) * 0.37)) + ')';
    g.fillRect(hh(i * 3.1) * w, hh(i * 7.7) * h, 0.004 * w, 0.004 * w);
  }
  return w;
}
function glowText(w, text) {      // 点数。左右に色をずらして重ね、最後に白
  g.textAlign = 'center'; g.font = 'bold ' + Math.round(0.12 * w) + 'px sans-serif';
  lit(() => { g.fillStyle = '#ff3df0'; g.fillText(String(text), 0.494 * w, 0.2 * w); g.fillStyle = '#19e6ff'; g.fillText(String(text), 0.506 * w, 0.2 * w); });
  g.fillStyle = '#fff'; g.fillText(String(text), 0.5 * w, 0.2 * w);
}

GF.onDraw(() => {
  const w = begin(), h = cv.height, f = GF.frame;
  lit(() => {
    gridFloor(w, h, 1.2 * w, f);
    for (const s of shots) orb(s.x * w, s.y * w, BR * w, '255,59,107', 0, -s.vy * w * 9);
    const col = dead ? '#ff3b6b' : '#7df9ff';
    if (!dead) glowLine(w, [[px * w, (PY + PR * 0.9) * w], [px * w, (PY + PR * (1.7 + hh(f) * 0.9)) * w]], '#ff3df0', 0.009 * w);
    glowLine(w, [[(px - PR) * w, (PY + PR) * w], [px * w, (PY - PR * 1.3) * w], [(px + PR) * w, (PY + PR) * w], [px * w, (PY + PR * 0.4) * w]], col, 0.011 * w, true);
    if (dead) { ring(w, px * w, PY * w, 0.35, '#ff3b6b'); sparks(w, px * w, PY * w, 4, 1, '#ff3b6b'); }
  });
  glowText(w, GF.score);
  scanlines(w, h);
});
</script>
</body>
</html>
