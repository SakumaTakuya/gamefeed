<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>あめよけ</title>
<meta name="gf:duration" content="600">
<meta name="gf:verb" content="よけろ！">
<meta name="gf:input" content="drag">
<meta name="gf:target" content="85">
<style>
  html, body { margin: 0; height: 100%; background: #101018; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 降ってくる玉を、指の左右の位置を追う自機でよける。当たると終わり。耐えた時間が点数（6 フレームで 1 点、100 点まで）
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');
function begin() {                // 描画の前に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
  g.fillStyle = '#101018'; g.fillRect(0, 0, w, cv.height);
  return w;
}
function hud(w, text) {
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold ' + Math.round(0.09 * w) + 'px sans-serif';
  g.fillText(String(text), 0.5 * w, 0.15 * w);
}
const PY = 1.45, PR = 0.04, BR = 0.035, MAXV = 0.03;
let px, fx, shots, dead, count;   // fx: 指の位置、shots: { x, y, vy }

GF.onInit(() => { px = 0.5; fx = 0.5; shots = []; dead = false; count = 0; GF.score = 0; });

GF.onInput((ev) => { if (ev.kind === 'drag') fx = ev.data[0]; });

GF.onTick((frame) => {
  if (dead) return;
  px += Math.max(-MAXV, Math.min(MAXV, fx - px));
  px = Math.max(PR, Math.min(1 - PR, px));
  const every = Math.max(7, 14 - Math.floor(frame / 80));
  if (frame % every === 0) {
    count += 1;
    const r = GF.rng();
    // 3 発に 1 発は自機の真上から。じっとしていると当たる
    shots.push({ x: count % 3 === 0 ? px : 0.05 + r * 0.9, y: -0.05, vy: 0.02 + frame * 0.00002 });
  }
  for (const s of shots) {
    s.y += s.vy;
    if ((s.x - px) ** 2 + (s.y - PY) ** 2 < (PR + BR) ** 2) dead = true;
  }
  shots = shots.filter(s => s.y < A + 0.1);
  if (dead) { GF.end(); return; }
  GF.score = Math.floor((frame + 1) / 6);
});

GF.onDraw(() => {
  const w = begin();
  g.fillStyle = '#7fd4ff';
  for (const s of shots) { g.beginPath(); g.arc(s.x * w, s.y * w, BR * w, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = dead ? '#ff5c5c' : '#ffd400';
  g.beginPath(); g.arc(px * w, PY * w, PR * w, 0, Math.PI * 2); g.fill();
  hud(w, GF.score);
});
</script>
</body>
</html>
