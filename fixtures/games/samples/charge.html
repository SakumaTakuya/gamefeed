<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ためジャンプ</title>
<meta name="gf:duration" content="480">
<meta name="gf:verb" content="ためろ！">
<meta name="gf:input" content="hold">
<meta name="gf:target" content="240">
<style>
  html, body { margin: 0; height: 100%; background: #101a26; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 押している間たまる力を、印のところで離す。印との近さが点数（1 回 100 まで）。3 回
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');
function begin() {                // 描画の前に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
  g.fillStyle = '#101a26'; g.fillRect(0, 0, w, cv.height);
  return w;
}
function hud(w, text) {
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold ' + Math.round(0.09 * w) + 'px sans-serif';
  g.fillText(String(text), 0.5 * w, 0.15 * w);
}
const STEP = 1 / 70;              // 1 フレームにたまる量（満タンが 1）
let round, power, goal, holding, wasHolding, wait, last;

GF.onInit(() => {
  round = 0; power = 0; goal = 0.35 + GF.rng() * 0.55; holding = false; wasHolding = false; wait = 0; last = -1;
  GF.score = 0;
});

GF.onInput((ev) => { if (ev.kind === 'hold') holding = ev.data[2] === 1; });

GF.onTick(() => {
  if (round >= 3) { if (wait > 0) wait -= 1; else GF.end(); return; }
  if (wait > 0) { wait -= 1; if (wait === 0) { power = 0; goal = 0.35 + GF.rng() * 0.55; } wasHolding = holding; return; }
  if (holding) {
    power = Math.min(1, power + STEP);
  } else if (wasHolding && power > 0) {
    last = Math.max(0, Math.round(100 - Math.abs(power - goal) * 250));
    GF.score += last; round += 1; wait = 30;
  }
  wasHolding = holding;
});

GF.onDraw(() => {
  const w = begin();
  const x = 0.38 * w, top = 0.4 * w, h = 1.1 * w;
  g.fillStyle = '#243447'; g.fillRect(x, top, 0.24 * w, h);
  g.fillStyle = wait > 0 ? '#ffd400' : '#4fa3ff'; g.fillRect(x, top + h * (1 - power), 0.24 * w, h * power);
  g.fillStyle = '#fff'; g.fillRect(0.3 * w, top + h * (1 - goal) - 0.006 * w, 0.4 * w, 0.012 * w);
  if (wait > 0 && last >= 0) { g.textAlign = 'center'; g.font = 'bold ' + Math.round(0.08 * w) + 'px sans-serif'; g.fillText('+' + last, 0.82 * w, 0.95 * w); }
  hud(w, GF.score);
});
</script>
</body>
</html>
