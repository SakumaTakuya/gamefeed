<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>やじるしフリック</title>
<meta name="gf:duration" content="300">
<meta name="gf:verb" content="はじけ！">
<meta name="gf:input" content="swipe">
<meta name="gf:target" content="10">
<style>
  html, body { margin: 0; height: 100%; background: #141c14; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 出ている矢印の向きにスワイプする。合えば 1 点。違う向きだと少しのあいだ動けない
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');
function begin() {                // 描画の前に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
  g.fillStyle = '#141c14'; g.fillRect(0, 0, w, cv.height);
  return w;
}
function hud(w, text) {
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold ' + Math.round(0.09 * w) + 'px sans-serif';
  g.fillText(String(text), 0.5 * w, 0.15 * w);
}
// 向き: 0 右、1 下、2 左、3 上
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
let dir, wait, freeze, swipes;

function nextDir() { dir = (dir + 1 + Math.floor(GF.rng() * 3)) % 4; }   // 必ず今と違う向き

GF.onInit(() => { dir = Math.floor(GF.rng() * 4); wait = 0; freeze = 0; swipes = []; GF.score = 0; });

GF.onInput((ev) => {
  if (ev.kind === 'swipe') swipes.push([ev.data[2] - ev.data[0], (ev.data[3] - ev.data[1]) * A]);
});

GF.onTick(() => {
  const got = swipes; swipes = [];
  if (wait > 0) { wait -= 1; return; }
  if (freeze > 0) { freeze -= 1; return; }
  for (const [dx, dy] of got) {
    if (dx * dx + dy * dy < 0.08 * 0.08) continue;
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3);
    if (d === dir) { GF.score += 1; nextDir(); wait = 8; } else { freeze = 30; }
    break;                         // 1 フレームに 1 本だけ見る
  }
});

GF.onDraw(() => {
  const w = begin();
  const cx = 0.5 * w, cy = 0.9 * w, s = 0.22 * w;
  const shake = freeze > 0 ? ((freeze % 4) - 1.5) * 0.01 * w : 0;
  g.save(); g.translate(cx + shake, cy); g.rotate(dir * Math.PI / 2); g.scale(wait > 0 ? 1 - wait / 16 : 1, wait > 0 ? 1 - wait / 16 : 1);
  g.fillStyle = freeze > 0 ? '#ff5c5c' : '#ffd400';
  g.beginPath();
  g.moveTo(s, 0); g.lineTo(0, -s * 0.8); g.lineTo(0, -s * 0.3); g.lineTo(-s, -s * 0.3);
  g.lineTo(-s, s * 0.3); g.lineTo(0, s * 0.3); g.lineTo(0, s * 0.8); g.closePath(); g.fill();
  g.restore();
  hud(w, GF.score);
});
</script>
</body>
</html>
