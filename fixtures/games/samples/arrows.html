<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>やじるしフリック</title>
<meta name="gf:duration" content="300">
<meta name="gf:verb" content="はじけ！">
<meta name="gf:input" content="swipe">
<meta name="gf:target" content="10">
<style>
  html, body { margin: 0; height: 100%; background: #22382e; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 出ている矢印の向きにスワイプする。合えば 1 点。違う向きだと少しのあいだ動けない
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');

// 向き: 0 右、1 下、2 左、3 上
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
let dir, wait, freeze, swipes;

function nextDir() { dir = (dir + 1 + Math.floor(GF.rng() * 3)) % 4; }   // 必ず今と違う向き

GF.onInit(() => { dir = Math.floor(GF.rng() * 4); wait = 0; freeze = 0; swipes = []; GF.score = 0; });

GF.onInput((ev) => {
  if (ev.kind === 'swipe') swipes.push([ev.data[2] - ev.data[0], (ev.data[3] - ev.data[1]) * A]);
});

GF.onTick(() => {
  const got = swipes; swipes = [];
  if (wait > 0) { wait -= 1; return; }
  if (freeze > 0) { freeze -= 1; return; }
  for (const [dx, dy] of got) {
    if (dx * dx + dy * dy < 0.08 * 0.08) continue;
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3);
    if (d === dir) { GF.score += 1; nextDir(); wait = 8; } else { freeze = 30; }
    break;                         // 1 フレームに 1 本だけ見る
  }
});

// ---- 絵: 画風カード「黒板」（gf://style/kokuban）。全部をチョークの震える線で描く。面は塗らない ----
const hh = (n) => { const x = Math.sin(n * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); };   // 絵のための乱数。引数だけで決まる。GF.rng() は絵に使わない
function chalk(w, pts, color, width, seed, closed, alpha = 1) {   // チョークの線（pts は px）。seed が同じなら同じ震え
  const j = 0.007 * w;
  for (let pass = 0; pass < 2; pass++) {
    g.beginPath();
    pts.forEach((p, i) => {
      const x = p[0] + (hh(seed + i * 3.1 + pass * 17) - 0.5) * j, y = p[1] + (hh(seed + i * 5.9 + pass * 29) - 0.5) * j;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    });
    if (closed) g.closePath();
    g.strokeStyle = color; g.globalAlpha = alpha * (pass ? 0.4 : 0.9);
    g.lineWidth = width * (pass ? 1.9 : 1); g.lineCap = g.lineJoin = 'round';
    g.setLineDash([(7 + hh(seed) * 6) * w / 360, 1.3 * w / 360, 4 * w / 360, 0.9 * w / 360]);
    g.lineDashOffset = hh(seed + pass) * 20;
    g.stroke();
  }
  g.setLineDash([]); g.globalAlpha = 1;
}
function ovalPts(x, y, rx, ry, n = 14) {
  const pts = [];
  for (let i = 0; i < n; i++) pts.push([x + Math.cos(i / n * Math.PI * 2) * rx, y + Math.sin(i / n * Math.PI * 2) * ry]);
  return pts;
}
function scribble(w, x, y, rx, ry, color, seed, isRound, alpha = 0.55) {   // 往復の線でざっと塗る（x, y, rx, ry は幅 1 の単位）
  const n = Math.max(2, Math.round(ry * 2 / 0.04)), pts = [];
  for (let i = 0; i < n; i++) {
    const yy = y - ry + (i + 0.5) / n * 2 * ry, half = isRound ? rx * Math.sqrt(Math.max(0, 1 - ((yy - y) / ry) ** 2)) : rx;
    if (i % 2) pts.push([(x + half) * w, yy * w], [(x - half) * w, yy * w]); else pts.push([(x - half) * w, yy * w], [(x + half) * w, yy * w]);
  }
  chalk(w, pts, color, 0.016 * w, seed, false, alpha);
}
function dust(w, x, y, age, seed, color) {   // チョークの粉。位置は age から計算する（状態を持たない）
  if (age < 0 || age > 40) return;
  g.fillStyle = color;
  for (let i = 0; i < 14; i++) {
    const s = (0.004 + hh(seed + i * 0.7) * 0.006) * w;
    g.globalAlpha = (1 - age / 40) * 0.8;
    g.fillRect((x + (hh(seed + i * 1.3) - 0.5) * (0.16 + age * 0.003)) * w, (y + (hh(seed + i * 2.3) - 0.5) * 0.05 - 0.002 * age * hh(seed + i * 3.1) + 0.00007 * age * age) * w, s, s);
  }
  g.globalAlpha = 1;
}
const SEI = [[2, 3, 18, 3], [10, 3, 10, 17], [10, 10, 16, 10], [5, 9, 5, 17], [1, 17, 19, 17]];
function tally(w, n) {            // 点数を「正」の字で数える
  const size = 0.09 * w, k = size / 20;
  for (let i = 0; i < n; i++) {
    const s = SEI[i % 5], x = 0.06 * w + Math.floor(i / 5) * size * 1.15, y = 0.08 * w;
    chalk(w, [[x + s[0] * k, y + s[1] * k], [x + s[2] * k, y + s[3] * k]], i === n - 1 ? '#ffe27a' : '#f4f4ec', 0.008 * w, i * 7.7);
  }
}
function chalkText(w, text, x, y, size, color, alpha = 0.9) {   // x, y, size は幅 1 の単位
  g.fillStyle = color; g.globalAlpha = alpha; g.textAlign = 'center';
  g.font = Math.round(size * w) + 'px sans-serif'; g.fillText(String(text), x * w, y * w); g.globalAlpha = 1;
}
let board = null;
function begin() {                // 描画の前に呼ぶ。黒板（消し跡と粉は 1 回だけ作る）と粉受けを描き、画面の幅（px）を返す
  const w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight;
  if (!board) {
    board = document.createElement('canvas'); board.width = 360; board.height = 640;
    const c = board.getContext('2d'); c.lineCap = 'round';
    for (let i = 0; i < 70; i++) {
      c.strokeStyle = 'rgba(255,255,255,' + (0.01 + hh(i) * 0.02) + ')'; c.lineWidth = 18 + hh(i + 0.1) * 46;
      const x = hh(i + 0.2) * 360, y = hh(i + 0.3) * 640, t = (hh(i + 0.4) - 0.5) * 0.6, l = 60 + hh(i + 0.5) * 160;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(t) * l, y + Math.sin(t) * l); c.stroke();
    }
    for (let i = 0; i < 2600; i++) { c.fillStyle = 'rgba(255,255,255,' + hh(i * 0.7) * 0.09 + ')'; c.fillRect(hh(i * 1.1) * 360, hh(i * 1.3) * 640, 1, 1); }
  }
  g.fillStyle = '#22382e'; g.fillRect(0, 0, w, h); g.drawImage(board, 0, 0, w, h);
  g.fillStyle = '#8a6844'; g.fillRect(0, 1.7 * w, w, h); g.fillStyle = '#6f5234'; g.fillRect(0, 1.7 * w, w, 0.014 * w);
  g.fillStyle = '#f4f4ec'; g.fillRect(0.7 * w, 1.68 * w, 0.085 * w, 0.02 * w); g.fillStyle = '#ffe27a'; g.fillRect(0.82 * w, 1.683 * w, 0.055 * w, 0.017 * w);
  return w;
}

GF.onDraw(() => {
  const w = begin(), f = GF.frame, boil = Math.floor(f / 7) * 13.7;         // boil: 7 フレームごとに線を引き直す
  const cx = 0.5 + (freeze > 0 ? ((freeze % 4) - 1.5) * 0.01 : 0), cy = 0.9, s = 0.22 * (wait > 0 ? 1 - wait / 16 : 1);
  const co = Math.cos(dir * Math.PI / 2), si = Math.sin(dir * Math.PI / 2);
  const pts = [[1, 0], [0, -0.8], [0, -0.3], [-1, -0.3], [-1, 0.3], [0, 0.3], [0, 0.8]]
    .map(([u, v]) => [(cx + (u * co - v * si) * s) * w, (cy + (u * si + v * co) * s) * w]);
  const col = freeze > 0 ? '#ff9d9d' : '#ffe27a';
  chalk(w, ovalPts(0.5 * w, 0.9 * w, 0.34 * w, 0.34 * w, 18), '#f4f4ec', 0.006 * w, 4, true, 0.3);
  g.fillStyle = col; g.globalAlpha = 0.16; g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.fill(); g.globalAlpha = 1;
  chalk(w, pts, col, 0.014 * w, boil + dir * 5, true);
  if (freeze > 0) {
    chalk(w, [[0.3 * w, 0.7 * w], [0.7 * w, 1.1 * w]], '#ff9d9d', 0.012 * w, 31, false, 0.6);
    chalk(w, [[0.7 * w, 0.7 * w], [0.3 * w, 1.1 * w]], '#ff9d9d', 0.012 * w, 37, false, 0.6);
  }
  if (wait > 0) dust(w, 0.5, 0.9, (8 - wait) * 3, GF.score, '#ffe27a');
  tally(w, GF.score);
});
</script>
</body>
</html>
