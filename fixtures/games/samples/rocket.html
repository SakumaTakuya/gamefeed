<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>れんだロケット</title>
<meta name="gf:duration" content="240">
<meta name="gf:verb" content="れんだ！">
<meta name="gf:input" content="tap">
<meta name="gf:target" content="24">
<style>
  html, body { margin: 0; height: 100%; background: #0b1026; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 画面をたたいた回数だけロケットが上がる。1 回 1 点（60 点まで）
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');
function begin() {                // 描画の前に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth;
  cv.height = cv.clientHeight;
  g.fillStyle = '#0b1026'; g.fillRect(0, 0, w, cv.height);
  return w;
}
function hud(w, text) {
  g.fillStyle = '#fff'; g.textAlign = 'center';
  g.font = 'bold ' + Math.round(0.09 * w) + 'px sans-serif';
  g.fillText(String(text), 0.5 * w, 0.15 * w);
}
let taps, burn;                  // burn: 炎を出す残りフレーム

GF.onInit(() => { taps = 0; burn = 0; GF.score = 0; });

GF.onInput((ev) => { if (ev.kind === 'tap') taps += 1; });

GF.onTick(() => {
  if (taps > 0 && GF.score < 60) { GF.score += 1; burn = 5; }   // 1 フレームに数えるのは 1 回まで
  taps = 0;
  if (burn > 0) burn -= 1;
});

GF.onDraw(() => {
  const w = begin();
  const y = (1.55 - GF.score * 0.02) * w, x = 0.5 * w;
  g.fillStyle = '#2a3566'; g.fillRect(0, 1.62 * w, w, (A - 1.62) * w);
  if (burn > 0) {
    g.fillStyle = '#ff8a3c'; g.beginPath();
    g.moveTo(x - 0.04 * w, y + 0.08 * w); g.lineTo(x + 0.04 * w, y + 0.08 * w); g.lineTo(x, y + (0.14 + burn * 0.015) * w); g.fill();
  }
  g.fillStyle = '#fff'; g.fillRect(x - 0.05 * w, y - 0.08 * w, 0.1 * w, 0.16 * w);
  g.fillStyle = '#ff5c5c'; g.beginPath();
  g.moveTo(x - 0.05 * w, y - 0.08 * w); g.lineTo(x + 0.05 * w, y - 0.08 * w); g.lineTo(x, y - 0.17 * w); g.fill();
  hud(w, GF.score);
});
</script>
</body>
</html>
