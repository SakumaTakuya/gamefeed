<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ぬりつぶし</title>
<meta name="gf:duration" content="300">
<meta name="gf:verb" content="ぬれ！">
<meta name="gf:input" content="drag">
<meta name="gf:target" content="80">
<style>
  html, body { margin: 0; height: 100%; background: #141433; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 指でなぞったマスに色が付く。塗ったマスの数が点数（8 × 12 = 96 マス）
const A = 16 / 9;                 // 画面の幅を 1 としたときの高さ。座標はこの単位で持つ
const cv = document.getElementById('c');
const g = cv.getContext('2d');

const COLS = 8, ROWS = 12, CELL = 1 / COLS, TOP = 0.2;
let cells, painted, last, moves;  // last: 直前の指の位置（離すと null）

GF.onInit(() => { cells = new Array(COLS * ROWS).fill(false); painted = 0; last = null; moves = []; GF.score = 0; });

GF.onInput((ev) => { if (ev.kind === 'drag') moves.push([ev.data[0], ev.data[1] * A, ev.data[2]]); });

function paintAt(x, y) {
  const c = Math.floor(x / CELL), r = Math.floor((y - TOP) / CELL);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  if (!cells[r * COLS + c]) { cells[r * COLS + c] = true; painted += 1; }
}

GF.onTick(() => {
  for (const [x, y, down] of moves) {
    if (down !== 1) { last = null; continue; }
    if (last) {
      // 速くなぞってもマスを飛ばさないよう、前の位置との間を細かく塗る
      const n = Math.ceil(Math.max(Math.abs(x - last[0]), Math.abs(y - last[1])) / (CELL / 2));
      for (let i = 1; i < n; i++) paintAt(last[0] + (x - last[0]) * i / n, last[1] + (y - last[1]) * i / n);
    }
    paintAt(x, y);
    last = [x, y];
  }
  moves = [];
  GF.score = painted;
});

// ---- 絵: 画風カード「ドット絵」（gf://style/dot）。90 × 160 の小さな画面に 8 色で描き、補間なしで引き伸ばす ----
const hh = (n) => { const x = Math.sin(n * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); };   // 絵のための乱数。引数だけで決まる。GF.rng() は絵に使わない
const U = 90, LOW_W = 90, LOW_H = 160;   // 幅 1 の単位は、小さな画面では 90 ドット
const low = document.createElement('canvas'); low.width = LOW_W; low.height = LOW_H;
const lg = low.getContext('2d');
function px(x, y, pw, ph, color) { lg.fillStyle = color; lg.fillRect(Math.round(x), Math.round(y), pw, ph); }   // 四角を 1 つ。位置は丸める
function sprite(rows, x, y, map) {   // rows は文字の行、map は文字から色。'.' は透明
  for (let j = 0; j < rows.length; j++) {
    for (let i = 0; i < rows[j].length; i++) { const ch = rows[j][i]; if (ch !== '.') px(x + i, y + j, 1, 1, map[ch]); }
  }
}
function night() {                // 地と、瞬く星
  px(0, 0, LOW_W, LOW_H, '#141433');
  for (let i = 0; i < 34; i++) if (hh(i + Math.floor(GF.frame / 22) * 0.61) > 0.25) px(hh(i * 3.3) * LOW_W, hh(i * 9.1) * LOW_H, 1, 1, i % 5 ? '#5762d5' : '#f2f0e6');
}
function sparks8(x, y, age, c1, c2) {   // 8 方向の粒。位置は age から計算する（状態を持たない）
  if (age < 0 || age > 12) return;
  for (let i = 0; i < 8; i++) { const s = age < 7 ? 2 : 1; px(x + Math.cos(i * Math.PI / 4) * age * 1.6, y + Math.sin(i * Math.PI / 4) * age * 1.6, s, s, i % 2 ? c1 : c2); }
}
function blit() {                 // 小さな画面を表示の canvas へ。毎フレームいちばん最後に呼ぶ。画面の幅（px）を返す
  const w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight;
  g.fillStyle = '#141433'; g.fillRect(0, 0, w, h);
  g.imageSmoothingEnabled = false; g.drawImage(low, 0, 0, w, w * LOW_H / LOW_W);   // 縦は幅に合わせる（縦長の端末で伸ばさない）
  return w;
}
function dotText(w, text) {       // 点数。右下に 1 ドットぶんずらした影
  g.textAlign = 'left'; g.font = 'bold ' + Math.round(0.11 * w) + 'px monospace';
  g.fillStyle = '#2a2f6e'; g.fillText(String(text), (0.06 + 1 / U) * w, (0.17 + 1 / U) * w);
  g.fillStyle = '#f2f0e6'; g.fillText(String(text), 0.06 * w, 0.17 * w);
}

GF.onDraw(() => {
  px(0, 0, LOW_W, LOW_H, '#141433');
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const x0 = Math.round(c * CELL * U), x1 = Math.round((c + 1) * CELL * U), y0 = Math.round((TOP + r * CELL) * U), y1 = Math.round((TOP + (r + 1) * CELL) * U);
    if (cells[r * COLS + c]) {
      px(x0 + 1, y0 + 1, x1 - x0 - 1, y1 - y0 - 1, '#ffd23f'); px(x0 + 2, y0 + 2, 3, 1, '#f2f0e6'); px(x0 + 2, y0 + 3, 1, 1, '#f2f0e6');
    } else {
      px(x0 + 1, y0 + 1, x1 - x0 - 1, y1 - y0 - 1, '#2a2f6e'); px(x0 + 5, y0 + 5, 2, 2, '#141433');
    }
  }
  px(34, 6, 52, 5, '#2a2f6e'); px(35, 7, Math.round(painted / (COLS * ROWS) * 50), 3, '#ffd23f');   // 塗った割合
  if (last) {                                                              // 筆
    const bx = Math.round(last[0] * U), by = Math.round(last[1] * U);
    px(bx - 3, by - 3, 7, 7, '#ef476f'); px(bx - 2, by - 2, 5, 5, '#f2f0e6'); px(bx - 1, by - 1, 3, 3, '#ffd23f');
  }
  dotText(blit(), GF.score);
});
</script>
</body>
</html>
